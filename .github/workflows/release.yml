name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Release tags must use semantic versions such as v1.2.3."
          }
      - name: Publish self-contained application
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: dotnet publish src/DaikinDesktopController.App -c Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:Version=$($env:VERSION.TrimStart('v')) -o artifacts\publish
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup 6 was not found on the GitHub-hosted runner.'
          }
          & $compiler "/DAppVersion=$($env:VERSION.TrimStart('v'))" installer\DaikinDesktopController.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          $asset = Get-ChildItem artifacts\installer\DaikinDesktopController-Setup-*.exe | Select-Object -First 1
          if ($null -eq $asset) {
            throw 'Installer artifact was not produced.'
          }
          gh release create $env:VERSION $asset.FullName --title $env:VERSION --generate-notes
